name: Generate Profile Visualizations

on:
  schedule:
    # Daily at 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "conf/github-profile-3d-contrib.json"
      - ".github/workflows/profile-visualizations.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Generate 3D calendar and contribution radar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # Set GH_PROFILE_TOKEN for expanded access to private repositories.
          # Falls back to the workflow token if the secret is not configured.
          GITHUB_TOKEN: ${{ secrets.GH_PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      - name: Publish SVGs to a dedicated branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-3d-contrib
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
